<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동네 인구 검색</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007BFF; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        ul { list-style-type: none; padding: 0; margin-top: 10px; }
        li { padding: 10px; border: 1px solid #ccc; margin-top: -1px; cursor: pointer; background-color: #fff; }
        li:hover { background-color: #f0f0f0; }
        #result { margin-top: 20px; padding: 20px; border: 1px solid #007BFF; border-radius: 5px; background-color: #e9f5ff; display: none; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>우리동네 인구 검색</h1>
    <p id="status" class="loading">행정안전부 데이터를 불러오는 중입니다...</p>
    
    <div id="search-container" style="display: none;">
        <input type="text" id="searchInput" placeholder="동네 이름 입력 (예: 사직동)">
        <button id="searchBtn">검색</button>
        <ul id="suggestions"></ul>
    </div>

    <div id="result">
        <h2 id="res-name"></h2>
        <p><strong>총 인구수:</strong> <span id="res-total"></span>명</p>
        <p><strong>남성 인구수:</strong> <span id="res-male"></span>명</p>
        <p><strong>여성 인구수:</strong> <span id="res-female"></span>명</p>
    </div>

    <script>
        const CSV_URL = 'https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv';
        let populationData = [];

        // 큰따옴표 안의 쉼표를 무시하며 CSV를 파싱하는 함수
        function parseCSV(text) {
            const results = [];
            let row = [];
            let inQuotes = false;
            let currentValue = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentValue.trim());
                    currentValue = '';
                } else if (char === '\n' && !inQuotes) {
                    row.push(currentValue.trim());
                    if (row.length > 1 || row[0] !== "") results.push(row);
                    row = [];
                    currentValue = '';
                } else if (char !== '\r') {
                    currentValue += char;
                }
            }
            if (currentValue || row.length > 0) {
                row.push(currentValue.trim());
                results.push(row);
            }
            return results;
        }

        async function loadData() {
            try {
                // EUC-KR로 저장된 CSV 파일 불러오기
                const response = await fetch(CSV_URL);
                const buffer = await response.arrayBuffer();
                const decoder = new TextDecoder('euc-kr');
                const csvText = decoder.decode(buffer);
                
                const rows = parseCSV(csvText);
                if (rows.length < 2) throw new Error("데이터 형식이 올바르지 않습니다.");

                const header = rows[0];
                let colRegion = -1, colTotal = -1, colMale = -1, colFemale = -1;

                // 년/월에 상관없이 동적으로 열 인덱스 찾기
                for (let i = 0; i < header.length; i++) {
                    if (header[i].includes('행정구역')) colRegion = i;
                    // "_총인구수"로 끝나고 성별 조건이 없는 열이 전체 총인구수
                    else if (header[i].includes('_총인구수') && !header[i].includes('_남_') && !header[i].includes('_여_')) colTotal = i;
                    else if (header[i].includes('_남_총인구수')) colMale = i;
                    else if (header[i].includes('_여_총인구수')) colFemale = i;
                }

                populationData = rows.slice(1).map(row => {
                    if (!row[colRegion]) return null;
                    
                    // 지역 이름 뒤 괄호(숫자) 제거
                    const regionRaw = row[colRegion];
                    const regionClean = regionRaw.replace(/\([^)]*\)/g, '').trim();

                    return {
                        name: regionClean,
                        total: row[colTotal] || '0',
                        male: row[colMale] || '0',
                        female: row[colFemale] || '0'
                    };
                }).filter(item => item !== null);

                document.getElementById('status').style.display = 'none';
                document.getElementById('search-container').style.display = 'block';

            } catch (error) {
                document.getElementById('status').textContent = '데이터를
