<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 인구 대시보드</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            /* 기본 크림 테마 */
            --bg: #fcfbf9; --card-bg: #ffffff; --text: #4a4a4a; 
            --primary: #d4a373; --shadow: rgba(0,0,0,0.05);
            --male: #7fa8d6; --female: #e28f9d;
        }
        [data-theme="mint"] {
            --bg: #e0f7fa; --card-bg: #ffffff; --text: #004d40; 
            --primary: #26a69a; --shadow: rgba(0,100,100,0.08);
        }
        [data-theme="berry"] {
            --bg: #fce4ec; --card-bg: #ffffff; --text: #880e4f; 
            --primary: #ec407a; --shadow: rgba(100,0,50,0.08);
        }

        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; transition: background 0.3s; }
        h1 { text-align: center; margin-bottom: 10px; }
        
        .theme-btns { text-align: center; margin-bottom: 20px; }
        .theme-btns button { border: none; padding: 6px 12px; margin: 0 5px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .btn-cream { background: #fdf5e6; color: #8b5a2b; border: 1px solid #e3cda4 !important; }
        .btn-mint { background: #b2dfdb; color: #004d40; }
        .btn-berry { background: #f8bbd0; color: #880e4f; }

        .search-wrap { display: flex; gap: 10px; position: relative; }
        input[type="text"] { flex: 1; padding: 14px; font-size: 16px; border: 2px solid var(--primary); border-radius: 8px; outline: none; background: var(--card-bg); color: var(--text); }
        button.search-btn { padding: 0 24px; font-size: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
        button.search-btn:hover { opacity: 0.8; }
        
        ul { list-style: none; padding: 0; margin: 5px 0 0 0; position: absolute; width: 100%; top: 50px; z-index: 10; background: var(--card-bg); border-radius: 8px; box-shadow: 0 4px 12px var(--shadow); }
        li { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #eee; }
        li:last-child { border-bottom: none; }
        li:hover { background: rgba(0,0,0,0.03); }

        .dashboard { margin-top: 30px; display: none; }
        .dashboard h2 { text-align: center; margin-bottom: 20px; font-size: 1.8em; }
        
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow); text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 1em; opacity: 0.8; }
        .card p { margin: 0; font-size: 1.4em; font-weight: bold; color: var(--primary); }
        .card .sub-text { font-size: 0.85em; color: var(--text); margin-top: 5px; opacity: 0.8; }

        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow); height: 500px; }
        .loading { text-align: center; padding: 50px; font-style: italic; opacity: 0.6; }

        @media (max-width: 600px) {
            .cards { grid-template-columns: repeat(2, 1fr); }
            .card p { font-size: 1.2em; }
            .chart-container { height: 400px; padding: 10px; }
        }
    </style>
</head>
<body>

    <h1>우리동네 인구 대시보드</h1>
    <div class="theme-btns">
        <button class="btn-cream" onclick="setTheme('cream')">크림 🍦</button>
        <button class="btn-mint" onclick="setTheme('mint')">민트 🌿</button>
        <button class="btn-berry" onclick="setTheme('berry')">베리 🍓</button>
    </div>

    <p id="status" class="loading">데이터를 불러오는 중입니다...</p>
    
    <div id="search-container" style="display: none;">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="동네 이름 입력 (예: 사직동)">
            <button id="searchBtn" class="search-btn">검색</button>
            <ul id="suggestions"></ul>
        </div>
    </div>

    <div id="result" class="dashboard">
        <h2 id="res-name"></h2>
        
        <div class="cards">
            <div class="card">
                <h3>총 인구</h3>
                <p id="c-total"></p>
                <div class="sub-text">명</div>
            </div>
            <div class="card">
                <h3>남녀 인구</h3>
                <p id="c-gender" style="font-size: 1.1em;"></p>
                <div class="sub-text">남 / 여</div>
            </div>
            <div class="card">
                <h3>고령화율</h3>
                <p id="c-elder"></p>
                <div class="sub-text">65세 이상</div>
            </div>
            <div class="card">
                <h3>유소년 비율</h3>
                <p id="c-youth"></p>
                <div class="sub-text">0~14세</div>
            </div>
        </div>

        <div class="chart-container">
            <div id="pyramid-chart" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://raw.githubusercontent.com/greatsong/modudata/main/data/population_latest.csv';
        let populationData = [], ageLabels = [];

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (document.getElementById('result').style.display === 'block') {
                Plotly.relayout('pyramid-chart', {
                    font: { color: getComputedStyle(document.body).getPropertyValue('--text') }
                });
            }
        }

        function parseCSV(text) {
            const results = []; let row = [], inQuotes = false, val = '';
            for (let char of text) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { row.push(val.trim()); val = ''; }
                else if (char === '\n' && !inQuotes) { row.push(val.trim()); if (row.length > 1 || row[0]) results.push(row); row = []; val = ''; }
                else if (char !== '\r') val += char;
            }
            if (val || row.length > 0) { row.push(val.trim()); results.push(row); }
            return results;
        }

        async function loadData() {
            try {
                const buffer = await (await fetch(CSV_URL)).arrayBuffer();
                const rows = parseCSV(new TextDecoder('euc-kr').decode(buffer));
                if (rows.length < 2) throw new Error("Invalid Data");

                const header = rows[0];
                let colReg=-1, colTot=-1, colM=-1, colF=-1, mCols=[], fCols=[];

                header.forEach((h, i) => {
                    if (h.includes('행정구역')) colReg = i;
                    else if (h.includes('_총인구수') && !h.includes('_남_') && !h.includes('_여_')) colTot = i;
                    else if (h.includes('_남_총인구수')) colM = i;
                    else if (h.includes('_여_총인구수')) colF = i;
                    if (h.includes('_남_') && h.includes('세') && !h.includes('연령구간') && !h.includes('총인구')) mCols.push(i);
                    if (h.includes('_여_') && h.includes('세') && !h.includes('연령구간') && !h.includes('총인구')) fCols.push(i);
                });

                ageLabels = mCols.map(i => header[i].split('_').pop());
                const parseNum = (v) => parseInt((v || '0').replace(/,/g, ''), 10) || 0;

                populationData = rows.slice(1).map(row => {
                    if (!row[colReg]) return null;
                    return {
                        name: row[colReg].replace(/\([^)]*\)/g, '').trim(),
                        total: parseNum(row[colTot]),
                        male: parseNum(row[colM]),
                        female: parseNum(row[colF]),
                        maleAges: mCols.map(i => parseNum(row[i])),
                        femaleAges: fCols.map(i => parseNum(row[i]))
                    };
                }).filter(Boolean);

                document.getElementById('status').style.display = 'none';
                document.getElementById('search-container').style.display = 'block';
            } catch (err) {
                document.getElementById('status').textContent = '데이터 로드 실패';
                console.error(err);
            }
        }

        function searchData() {
            const kw = document.getElementById('searchInput').value.trim();
            const box = document.getElementById('suggestions');
            box.innerHTML = '';
            
            if (!kw) return;
            const res = populationData.filter(item => item.name.includes(kw)).slice(0, 10);
            
            if (!res.length) { box.innerHTML = '<li>검색 결과 없음</li>'; return; }
            res.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name;
                li.onclick = () => { box.innerHTML=''; document.getElementById('searchInput').value=item.name; showResult(item); };
                box.appendChild(li);
            });
        }

        function showResult(item) {
            document.getElementById('res-name').textContent = item.name;
            
            // 비율 계산 로직
            let elder = 0, youth = 0;
            ageLabels.forEach((label, i) => {
                const age = parseInt(label.replace(/[^0-9]/g, ''));
                const sum = item.maleAges[i] + item.femaleAges[i];
                if (age >= 65) elder += sum;
                if (age <= 14) youth += sum;
            });

            const elderRate = item.total ? ((elder / item.total) * 100).toFixed(1) : 0;
            const youthRate = item.total ? ((youth / item.total) * 100).toFixed(1) : 0;

            document.getElementById('c-total').textContent = item.total.toLocaleString();
            document.getElementById('c-gender').innerHTML = `<span style="color:var(--male)">${item.male.toLocaleString()}</span> / <span style="color:var(--female)">${item.female.toLocaleString()}</span>`;
            document.getElementById('c-elder').textContent = elderRate + '%';
            document.getElementById('c-youth').textContent = youthRate + '%';
            
            document.getElementById('result').style.display = 'block';
            drawPyramid(item);
        }

        function drawPyramid(item) {
            const style = getComputedStyle(document.body);
            const maleColor = style.getPropertyValue('--male').trim();
            const femaleColor = style.getPropertyValue('--female').trim();
            const textColor = style.getPropertyValue('--text').trim();

            const traceM = { x: item.maleAges.map(v => -v), y: ageLabels, name: '남성', type: 'bar', orientation: 'h', marker: { color: maleColor }, hoverinfo: 'text', text: item.maleAges.map((v, i) => `${ageLabels[i]} 남성: ${v.toLocaleString()}명`) };
            const traceF = { x: item.femaleAges, y: ageLabels, name: '여성', type: 'bar', orientation: 'h', marker: { color: femaleColor }, hoverinfo: 'text', text: item.femaleAges.map((v, i) => `${ageLabels[i]} 여성: ${v.toLocaleString()}명`) };

            const maxVal = Math.max(...item.femaleAges, ...item.maleAges);
            let tickStep = Math.pow(10, Math.max(0, Math.floor(Math.log10(maxVal || 1))));
            if (maxVal / tickStep < 2) tickStep /= 5; else if (maxVal / tickStep < 5) tickStep /= 2;

            const tickvals = [], ticktext = [];
            for (let v = 0; v <= maxVal; v += tickStep) {
                tickvals.push(v, -v); 
                ticktext.push(v === 0 ? '0' : (v >= 10000 ? (v/10000)+'만' : v.toLocaleString()), v === 0 ? '0' : (v >= 10000 ? (v/10000)+'만' : v.toLocaleString()));
            }

            const layout = {
                barmode: 'relative', margin: { l: 60, r: 20, t: 20, b: 40 },
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                font: { color: textColor },
                xaxis: { tickmode: 'array', tickvals: [...new Set(tickvals)], ticktext: [...new Set(ticktext)], zeroline: true, zerolinecolor: '#ddd' },
                yaxis: { autorange: true, tickfont: { size: 10 } },
                legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: 1.1 }
            };

            Plotly.newPlot('pyramid-chart', [traceM, traceF], layout, { displayModeBar: false, responsive: true });
        }

        document.getElementById('searchBtn').addEventListener('click', searchData);
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchData(); });
        document.getElementById('searchInput').addEventListener('input', searchData); // 입력할 때마다 자동완성

        setTheme('cream'); // 초기 테마
        loadData();
    </script>
</body>
</html>
